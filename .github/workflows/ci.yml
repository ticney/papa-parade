name: CI

# The quick checks only, on what reached `main`. The browsers, the builds and the perf budget are in
# `npm run ci`, run locally before a playtest link (CLAUDE.md).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # One step per stage, in this order: the first failure stops the job.
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: content:check
        run: npm run content:check
      - name: test
        run: npm test
