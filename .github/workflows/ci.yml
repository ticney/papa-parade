name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # One step per stage, in this order: the first failure stops the job.
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: content:check
        run: npm run content:check
      - name: test
        run: npm run test
      - name: e2e
        run: npm run e2e
      - name: build:playtest
        run: npm run build:playtest
