# Team override for gds-code-review: one git branch per story (Geo, 2026-10-28).
# See CLAUDE.md › Git workflow. Enforced for agents by .claude/hooks/guard-main-commit.sh.

[workflow]

persistent_facts = [
  "A story is reviewed on its branch `story/<story_key>`. Switch to it before reviewing if needed (`git switch story/<story_key>`; in a story worktree you are already on it); the diff under review is `git diff main...story/<story_key>`. If the branch does not exist, or git refuses because it is checked out in another worktree, stop and tell Geo.",
  "Review fixes are committed on the story branch with the message `Story <epic>.<story> : corrections de la revue de code` (French, a space before the colon). Never commit on `main`.",
]

on_complete = "If the story is now `done`: on the story branch, run `env | grep VITE_` then `(unset VITE_DEBUG_ALLOWED; npm run ci)`. If it is red, stop and report: no merge. If it is green, commit any remaining story-branch changes, then ask Geo explicitly whether to merge `story/<story_key>` into `main` (show `git log --oneline main..story/<story_key>`). Only after a clear yes, merge where `main` is checked out: find it with `git worktree list` (the entry marked `[main]`; usually the main checkout). If no worktree has `main`, run `git switch main` here. Call that folder M and run every command below with `git -C M`. If M has uncommitted changes, stop and ask Geo. Then: `git -C M pull --ff-only origin main` if the remote is reachable, `git -C M merge --no-ff story/<story_key> -m \"Story <epic>.<story> : merge de story/<story_key>\"`. A conflict limited to status lines of `sprint-status.yaml` or to appended sections of `deferred-work.md` / `project-context.md` (another story merged first) is resolved by keeping both sides, then `git -C M commit --no-edit`; any other conflict: `git -C M merge --abort`, stop and ask Geo. Then `git -C M push origin main` (retry on network errors only). Clean up: if the story ran in its own worktree (`npm run story:new`), do not delete it from inside; tell Geo to run `git worktree remove <this folder> && git branch -d story/<story_key>` from the main checkout. Otherwise `git branch -d story/<story_key>`. Also `git push origin --delete story/<story_key>` if the branch was pushed. If Geo says no or does not answer, leave the branch as it is."
