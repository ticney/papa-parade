# Team override for gds-code-review: one git branch and one worktree per story (Geo, 2026-10-28).
# See CLAUDE.md › Git workflow. Enforced for agents by .claude/hooks/guard-main-commit.sh.

[workflow]

persistent_facts = [
  "A story is reviewed in its own git worktree, on its branch `story/<story_key>` (CLAUDE.md › Git workflow). Before reviewing: run `npm run story:new -- <epic>-<story>` (e.g. `2-3`); its last line is `WORKTREE=<path>`. If `<path>` is not your current folder, call the `EnterWorktree` tool with `path` set to it. The diff under review is `git diff main...story/<story_key>`. If the script fails, stop and tell Geo.",
  "Review fixes are committed on the story branch with the message `Story <epic>.<story> : corrections de la revue de code` (French, a space before the colon). Never commit on `main`.",
]

on_complete = "If the story is now `done`: in the story worktree, run `env | grep VITE_` then `(unset VITE_DEBUG_ALLOWED; npm run ci)`. If it is red, stop and report: no merge. If it is green, commit any remaining story-branch changes, then ask Geo explicitly whether to merge `story/<story_key>` into `main` (show `git log --oneline main..story/<story_key>`). Only after a clear yes: (1) Pick the folder M where the merge happens: the worktree that `git worktree list` shows with `[main]`; if none has `main`, the story worktree itself, after `git switch main` there (its tree is clean now). If M has uncommitted changes, stop and ask Geo. (2) `git -C M pull --ff-only origin main` if the remote is reachable, then `git -C M merge --no-ff story/<story_key> -m \"Story <epic>.<story> : merge de story/<story_key>\"`. A conflict limited to status lines of `sprint-status.yaml` or to appended sections of `deferred-work.md` / `project-context.md` (another story merged first) is resolved by keeping both sides, then `git -C M commit --no-edit`; any other conflict: `git -C M merge --abort`, stop and ask Geo. (3) `git -C M push origin main` (retry on network errors only). (4) Clean up, with no command left to Geo: call `ExitWorktree` with `action: \"keep\"` if you entered the worktree with `EnterWorktree`; then, unless the story ran in the main checkout itself, `git worktree remove <story worktree path>` (never `--force`: if it refuses, say why and leave it); then check `git merge-base --is-ancestor story/<story_key> main` and only then `git branch -D story/<story_key>`, plus `git push origin --delete story/<story_key>` if the branch was pushed. If Geo says no or does not answer, leave the branch and the worktree as they are."
