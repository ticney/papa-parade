# Team override for gds-create-story: one git branch and one worktree per story (Geo, 2026-10-28).
# See CLAUDE.md › Git workflow. Enforced for agents by .claude/hooks/guard-main-commit.sh.

[workflow]

activation_steps_prepend = [
  "Git pre-flight: if the current folder is on `main` with a clean tree and `origin` is reachable, run `git pull --ff-only origin main`. Do not switch branches in the current folder: the story gets its own worktree below.",
]

persistent_facts = [
  "Every story runs in its own git worktree, on its branch `story/<story_key>`, from creation to merge (CLAUDE.md › Git workflow). As soon as the story key is known (step 1), and before writing any file: run `npm run story:new -- <epic>-<story>` (e.g. `2-3`). It creates the worktree, or finds the one that already holds the branch; its last line is `WORKTREE=<path>`. If `<path>` is not your current folder, call the `EnterWorktree` tool with `path` set to it, and do all the work there. If the script fails, stop and tell Geo. Never write the story file or the sprint-status change on `main`.",
  "At the end of the workflow, commit the story file and `sprint-status.yaml` on the story branch with the message `Story <epic>.<story> : création de la story` (French, a space before the colon). Do not merge and do not push. Leave the worktree in place: dev-story and code-review come back to it.",
]
