# Team override for gds-dev-story: one git branch and one worktree per story (Geo, 2026-10-28).
# See CLAUDE.md › Git workflow. Enforced for agents by .claude/hooks/guard-main-commit.sh.

[workflow]

persistent_facts = [
  "The story runs in its own git worktree, on its branch `story/<story_key>` (CLAUDE.md › Git workflow). Once the story is identified, and before the first edit (and before recording `baseline_commit`): run `npm run story:new -- <epic>-<story>` (e.g. `2-3`). It finds the worktree create-story opened, or creates it (and the branch, from `main`, for a story created before this rule); its last line is `WORKTREE=<path>`. If `<path>` is not your current folder, call the `EnterWorktree` tool with `path` set to it, and do all the work there. If the script fails, or the worktree has uncommitted changes that are not this story's, stop and tell Geo.",
  "Never switch branches inside a worktree, and never edit another story's worktree: other agents may be working there. The machine is shared with them: heavy checks queue behind each other (`heavy-lock: waiting for …` is normal, not a failure); if a check still times out under load, rerun the failing spec alone with `--workers=1` and say so. Each worktree has its own e2e port (playwright.config.ts).",
  "Commit the implementation on the story branch only, with the message `Story <epic>.<story> : <titre de la story en minuscules>` (French, a space before the colon). Never commit on `main`, never merge into `main`, never push `main`: the merge happens after the code review, with Geo's OK. Leave the worktree in place for the review.",
  "While developing, run `npm run ci:fast` after each task, and no browser. Only a task that changes the client wiring (input, a screen, the HUD, the `__PP__` API, the asset loading) also runs the one or two e2e specs that pin that change, on Chromium (`npm run e2e -- <specs> --project=chromium`, in the background: it waits its turn behind another agent's heavy check, CLAUDE.md › One heavy check at a time; never `npx playwright test`, which skips the queue), never a sweep of « the specs it might touch ». That is enough to set the story to `review`: do not run `npm run ci:story`, `npm run e2e:smoke`, the whole `npm run e2e` or `npm run ci` in dev-story, whatever the checklist or the story's acceptance criteria say; the review runs the gate before the merge (CLAUDE.md › Which check, when).",
  "Where a test goes (CLAUDE.md › Where a test goes): a game rule, a threat, a chore, a score or a bot's behaviour is proven in Vitest (sim tests, bots, goldens), even when the story's tasks or acceptance criteria ask for an e2e spec; say so in the Dev Agent Record. Write a new e2e spec only for client wiring that only a browser shows; it is in the extended tier (never add it to `tests/e2e/support/smokeSpecs.ts` without Geo's OK). A spec checks what the player sees, not the internals (no phase order, no save version number, no field layout of `state()`).",
]
