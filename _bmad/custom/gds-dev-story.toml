# Team override for gds-dev-story: one git branch and one worktree per story (Geo, 2026-10-28).
# See CLAUDE.md › Git workflow. Enforced for agents by .claude/hooks/guard-main-commit.sh.

[workflow]

persistent_facts = [
  "The story runs in its own git worktree, on its branch `story/<story_key>` (CLAUDE.md › Git workflow). Once the story is identified, and before the first edit (and before recording `baseline_commit`): run `npm run story:new -- <epic>-<story>` (e.g. `2-3`). It finds the worktree create-story opened, or creates it (and the branch, from `main`, for a story created before this rule); its last line is `WORKTREE=<path>`. If `<path>` is not your current folder, call the `EnterWorktree` tool with `path` set to it, and do all the work there. If the script fails, or the worktree has uncommitted changes that are not this story's, stop and tell Geo.",
  "Never switch branches inside a worktree, and never edit another story's worktree: other agents may be working there. The machine is shared with them: heavy checks queue behind each other (`heavy-lock: waiting for …` is normal, not a failure); if a check still times out under load, rerun the failing spec alone with `--workers=4` and say so. Each worktree has its own e2e port (playwright.config.ts).",
  "Commit the implementation on the story branch only, with the message `Story <epic>.<story> : <titre de la story en minuscules>` (French, a space before the colon). Never commit on `main`, never merge into `main`, never push `main`: the merge happens after the code review, with Geo's OK. Leave the worktree in place for the review.",
  "While developing, run `npm run ci:fast` after each task and, for what the change can touch, only the matching e2e specs on Chromium (`npm run e2e -- <specs> --project=chromium`, in the background: it waits its turn behind another agent's heavy check, CLAUDE.md › One heavy check at a time; never `npx playwright test`, which skips the queue). That is enough to set the story to `review`: do not run `npm run ci:story` or `npm run ci` in dev-story, whatever the checklist or the story's acceptance criteria say; the review runs the gate before the merge (CLAUDE.md › Which check, when).",
]
